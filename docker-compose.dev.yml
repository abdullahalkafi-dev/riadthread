# Local infrastructure for development: pnpm infra:up
# The database is MongoDB Atlas, so there is no Mongo container here.
name: riadthreads

services:
  # Rebuildable cache. It is allowed to evict old keys when memory is full.
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports: ['6379:6379']
    restart: unless-stopped

  # Job queue and rate-limit counters. Persistent, and must never evict keys.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes: ['redis-queue-data:/data']
    restart: unless-stopped

  # S3-compatible object storage for product media (SeaweedFS, single node).
  # Access keys and the anonymous read-only rule for the public bucket live in
  # docker/seaweedfs/s3.dev.json. These are development values only.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -volume.max=0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333']
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  redis-queue-data:
  seaweedfs-data:
