# Local infrastructure for development: pnpm infra:up
# The database is MongoDB Atlas, so there is no Mongo container here.
name: riadthreads

services:
  # Rebuildable cache. It is allowed to evict old keys when memory is full.
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports: ['6379:6379']
    restart: unless-stopped

  # Job queue and rate-limit counters. Persistent, and must never evict keys.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes: ['redis-queue-data:/data']
    restart: unless-stopped

  # S3-compatible object storage for product media.
  # The official minio/minio image is no longer published, so the image is configurable.
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-riadthreads}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-riadthreads-secret}
      MINIO_DEFAULT_BUCKETS: ''
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/bitnami/minio/data']
    restart: unless-stopped

volumes:
  redis-queue-data:
  minio-data:
